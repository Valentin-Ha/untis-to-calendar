[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "untis-to-calendar"
version = "0.1.0"
description = "Export WebUntis timetable to calendar formats"
requires-python = ">=3.10"
dependencies = [
    "webuntis>=0.1.21",
    "icalendar>=5.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
untis-calendar = "untis_to_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]