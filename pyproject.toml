[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "untis-to-calendar"
version = "0.9.0"
description = "Export a WebUntis timetable as an .ics file or sync it to a CalDAV calendar"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Ha" }]
keywords = ["webuntis", "untis", "timetable", "stundenplan", "calendar", "ical", "ics", "caldav"]

requires-python = ">=3.10"
dependencies = [
    "webuntis>=0.1.21",
    "icalendar>=6.1.0",
    "python-dateutil>=2.8.0",
    "caldav>=3.5",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Repository = "https://github.com/Valentin-Ha/untis-to-calendar"

[project.scripts]
untis-calendar = "untis_to_calendar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]